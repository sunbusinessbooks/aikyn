version: "3.9"

services:
  api:
    image: python:3.11
    container_name: aikyn_api
    working_dir: /app
    volumes:
      - ./api:/app
    command: bash -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant

  postgres:
    image: postgres:16
    container_name: aikyn_postgres
    environment:
      POSTGRES_DB: aikyn
      POSTGRES_USER: aikyn
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: aikyn_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aikyn_qdrant
    ports:
      - "6333:6333"

  nginx:
    image: nginx:latest
    container_name: aikyn_nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
